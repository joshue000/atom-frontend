<div class="settings-wrapper">
  @if (open()) {
    <div class="settings-panel" role="dialog" aria-label="Settings">
      <p class="panel-title">Settings</p>

      <mat-divider></mat-divider>

      <div class="setting-row">
        <mat-icon class="setting-icon">dark_mode</mat-icon>
        <span class="setting-label">Dark mode</span>
        <mat-slide-toggle
          [checked]="themeService.isDark()"
          (change)="themeService.toggle()"
          aria-label="Toggle dark mode"
          color="primary"
        ></mat-slide-toggle>
      </div>

      <mat-divider></mat-divider>

      <div class="setting-row setting-row--disabled" aria-disabled="true">
        <mat-icon class="setting-icon">language</mat-icon>
        <span class="setting-label">Language</span>
        <span class="coming-soon">Coming soon</span>
      </div>
    </div>
  }

  <button
    mat-fab
    color="primary"
    class="fab"
    (click)="toggle()"
    [matTooltip]="open() ? 'Close settings' : 'Settings'"
    aria-label="Settings"
  >
    <mat-icon>{{ open() ? 'close' : 'settings' }}</mat-icon>
  </button>
</div>
