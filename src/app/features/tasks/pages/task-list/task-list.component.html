<mat-toolbar color="primary" class="toolbar">
  <span class="toolbar-title">My Tasks</span>
  <button
    mat-icon-button
    (click)="onLogout()"
    matTooltip="Sign out"
    aria-label="Sign out"
  >
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<main class="content" role="main">
  <section aria-label="Add new task" class="form-section">
    <app-task-form
      #taskForm
      (taskSubmit)="onAddTask($event, taskForm)"
    ></app-task-form>
  </section>

  <mat-divider></mat-divider>

  <section aria-label="Task list" class="list-section">
    @if (loading()) {
      <div class="loading-state" role="status" aria-label="Loading tasks">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    } @else {
      @if (tasks$ | async; as tasks) {
        @if (tasks.length === 0) {
          <div class="empty-state" role="status">
            <mat-icon aria-hidden="true">task_alt</mat-icon>
            <p>No tasks yet. Add one above!</p>
          </div>
        } @else {
          <ul class="task-list" aria-label="Tasks">
            @for (task of tasks; track task.id) {
              <li>
                <app-task-card
                  [task]="task"
                  (toggleComplete)="onToggleComplete($event)"
                  (editTask)="onEditTask($event)"
                  (deleteTask)="onDeleteTask($event)"
                ></app-task-card>
              </li>
            }
          </ul>
        }
      }
    }
  </section>
</main>
