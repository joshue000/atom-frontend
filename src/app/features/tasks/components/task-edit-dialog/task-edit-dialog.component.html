<h2 mat-dialog-title>{{ i18n().tasks.editDialog.title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="onSave()" [attr.aria-label]="i18n().tasks.editDialog.title">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ i18n().tasks.editDialog.titleLabel }}</mat-label>
      <input
        matInput
        formControlName="title"
        [attr.aria-label]="i18n().tasks.editDialog.titleLabel"
      />
      @if (form.controls.title.hasError('required') && form.controls.title.touched) {
        <mat-error>{{ i18n().tasks.editDialog.titleRequired }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ i18n().tasks.editDialog.descriptionLabel }}</mat-label>
      <textarea
        matInput
        formControlName="description"
        rows="3"
        [attr.aria-label]="i18n().tasks.editDialog.descriptionLabel"
      ></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [attr.aria-label]="i18n().tasks.editDialog.cancel">
    {{ i18n().tasks.editDialog.cancel }}
  </button>
  <button
    mat-flat-button
    color="primary"
    [disabled]="form.invalid"
    (click)="onSave()"
    [attr.aria-label]="i18n().tasks.editDialog.save"
  >
    {{ i18n().tasks.editDialog.save }}
  </button>
</mat-dialog-actions>

<style>
  .full-width {
    width: 100%;
  }
  mat-dialog-content {
    min-width: 320px;
  }
</style>
