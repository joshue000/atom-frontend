<mat-card [class.completed]="task.completed" class="task-card">
  <mat-card-content class="task-content">
    <div class="task-main">
      <mat-checkbox
        [checked]="task.completed"
        [attr.aria-label]="
          i18n().tasks.card.markPrefix +
          ' ' +
          task.title +
          ' ' +
          (task.completed ? i18n().tasks.card.markAsPending : i18n().tasks.card.markAsCompleted)
        "
        (change)="toggleComplete.emit(task)"
        color="primary"
      ></mat-checkbox>

      <div class="task-info">
        <div class="task-title-row">
          <h3 class="task-title" [class.completed-text]="task.completed">
            {{ task.title }}
          </h3>
          <span class="status-badge" [class.completed]="task.completed">
            {{
              task.completed ? i18n().tasks.card.statusCompleted : i18n().tasks.card.statusPending
            }}
          </span>
        </div>
        @if (task.description) {
          <p class="task-description">{{ task.description }}</p>
        }
        <span class="task-date" aria-label="Created on">
          {{ task.createdAt | date: 'MMM d, y, h:mm a' }}
        </span>
      </div>
    </div>

    <div class="task-actions" role="group" [attr.aria-label]="'Actions for ' + task.title">
      <button
        mat-icon-button
        (click)="editTask.emit(task)"
        [matTooltip]="i18n().tasks.card.editTooltip"
        [attr.aria-label]="i18n().tasks.card.editTooltip"
      >
        <mat-icon>edit</mat-icon>
      </button>
      <button
        mat-icon-button
        color="warn"
        (click)="deleteTask.emit(task)"
        [matTooltip]="i18n().tasks.card.deleteTooltip"
        [attr.aria-label]="i18n().tasks.card.deleteTooltip"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </mat-card-content>
</mat-card>
