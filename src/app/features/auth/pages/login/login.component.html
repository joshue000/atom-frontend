<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Task Manager</mat-card-title>
      <mat-card-subtitle>Enter your email to continue</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" aria-label="Login form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email address</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email"
            aria-label="Email address"
            [attr.aria-describedby]="
              form.controls.email.invalid && form.controls.email.touched ? 'email-error' : null
            "
          />
          @if (form.controls.email.hasError('required') && form.controls.email.touched) {
            <mat-error id="email-error" role="alert">Email is required</mat-error>
          }
          @if (form.controls.email.hasError('email') && form.controls.email.touched) {
            <mat-error id="email-error" role="alert">Enter a valid email address</mat-error>
          }
        </mat-form-field>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="full-width submit-btn"
          [disabled]="loading()"
          aria-label="Continue"
        >
          @if (loading()) {
            <mat-spinner diameter="20" aria-label="Loading"></mat-spinner>
          } @else {
            Continue
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
